<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Flow dependencies</title>
    <link rel="stylesheet" href="sidepanel.css" />
    <link rel="stylesheet" href="qr-editor.css" />
    <link rel="stylesheet" href="flow-deps.css" />
  </head>
  <body class="qr-editor-page">
    <div id="error" class="banner banner-error" hidden title="Click to dismiss"></div>
    <div id="notice" class="banner banner-success" hidden></div>

    <header class="topbar fd-topbar">
      <div>
        <h1 id="fdTitle">Flow dependencies</h1>
        <p id="fdSubtitle" class="list-count"></p>
      </div>
      <div class="fd-actions">
        <button id="fdExportBtn" disabled>Export for LLM</button>
        <span class="info-tip" data-tip="Downloads one Markdown file with everything this scan found: the chains per Flow package and automation, which objects are not enabled or published, and the same data as JSON. Attach it to your LLM chat and tell the LLM what to write, for example a business-level integration document or a table of all triggers. Nothing is sent anywhere."></span>
        <button id="fdRescanBtn" class="btn-primary">Rescan</button>
      </div>
    </header>

    <div id="fdProgress" class="fd-progress" hidden>
      <div class="fd-progress-bar"><div id="fdProgressFill" class="fd-progress-fill"></div></div>
      <span id="fdProgressLabel" class="list-count"></span>
    </div>

    <p id="fdSummary" class="list-count" hidden></p>
    <div id="fdEmpty" class="empty-state" hidden></div>

    <div id="fdResults" class="fd-grid" hidden>
      <aside class="fd-side">
        <div class="fd-mode" role="group" aria-label="Group by">
          <span class="list-count">Group by</span>
          <button data-group-mode="endpoint">Endpoint</button>
          <button data-group-mode="package">Package</button>
          <span class="info-tip" data-tip="Endpoint: one group per URL that IFS calls. Package: one group per Flow package of the automation or app the URL calls (only for run.novacura.com and app.novacura.com; reads the packages of the organisation open in the Flow Designer tab). Calls to other addresses, and Flow URLs whose asset can't be found, get their own group."></span>
        </div>
        <div class="section-head"><h2 id="fdGroupHead">Endpoints</h2></div>
        <div id="fdGroupHint" class="empty-state" hidden></div>
        <label class="fd-only-enabled"><input type="checkbox" id="fdOnlyEnabled" /> Show only enabled <span class="info-tip" data-tip="Hides every chain that contains an event action or routing rule that is not enabled."></span></label>
        <div class="fd-filter"><input id="fdFilter" type="search" placeholder="Filter…" aria-label="Filter" /></div>
        <ul id="fdGroupList" class="fd-group-list"></ul>
      </aside>
      <section class="fd-main">
        <div class="section-head" id="fdGroupTitleRow"><h2 id="fdGroupTitle">Chains</h2></div>
        <div id="fdChains"></div>
      </section>
    </div>

    <details id="fdErrors" class="fd-errors" hidden>
      <summary id="fdErrorsSummary"></summary>
      <ul id="fdErrorList"></ul>
    </details>

    <script src="lib/flow-deps.js"></script>
    <script src="lib/flow-deps-export.js"></script>
    <script src="lib/ifs-links.js"></script>
    <script src="panels/common.js"></script>
    <script src="panels/info-tip.js"></script>
    <script src="flow-deps.js"></script>
  </body>
</html>
