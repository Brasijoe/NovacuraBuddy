<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>IFS Projection Inspector — Novacura Connect</title>
  <link rel="stylesheet" href="viewer.css" />
</head>
<body>
  <div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img class="nc-logo" src="../icons/icon48.png" width="22" height="22" alt="Novacura" />
        <div>
          <div class="sidebar-title">Novacura Connect</div>
          <div class="sidebar-sub">Traffic Explorer</div>
        </div>
      </div>

      <div class="sidebar-header">
        <span>Recorded Sessions</span>
        <button id="clearAllBtn" class="btn-ghost danger" title="Clear all sessions">Clear All</button>
      </div>

      <div id="sessionList" class="session-nav"></div>
    </aside>

    <!-- Main Workspace -->
    <main class="workspace">
      <header class="topbar">
        <div class="topbar-info">
          <h1 id="activeSessionName">No session selected</h1>
          <span id="activeSessionMeta" class="meta-badge">0 calls</span>
        </div>

        <div class="topbar-actions">
          <div class="search-box">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input id="searchInput" type="search" placeholder="Filter calls (e.g. Customer, POST, 200)..." />
          </div>
          <button id="expandAllBtn" class="btn-action">Expand All</button>
          <button id="collapseAllBtn" class="btn-action">Collapse All</button>
          <button id="optimizeCallsBtn" class="btn-action" title="Mark redundant/duplicate calls for deletion and merge same-record PATCH chains">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            Delete redundant &amp; merge updates
          </button>
          <button id="createAssetBtn" class="btn-action">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
            Create Asset
          </button>
          <button id="exportBtn" class="btn-action">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Export JSON
          </button>
          <button id="renameSessionBtn" class="btn-action">Rename</button>
          <button id="deleteSessionBtn" class="btn-action danger">Delete Session</button>
        </div>
      </header>

      <section id="callsContainer" class="calls-feed"></section>
    </main>
  </div>

  <div id="toast" class="toast">Copied to clipboard!</div>

  <script src="json-grid.js"></script>
  <script src="../lib/projection-filter.js"></script>
  <script src="flow-call-optimizer.js"></script>
  <script src="viewer.js"></script>
  <script src="flow-asset-heuristic.js"></script>
  <script src="flow-asset.js"></script>
  <script src="../lib/credential-crypto.js"></script>
  <script src="../lib/ifs-instances.js"></script>
  <script src="flow-steps.js"></script>
  <script src="flow-call-script.js"></script>
  <script src="flow-dependency-tracer.js"></script>
  <script src="flow-user-input.js"></script>
  <script src="flow-keyref.js"></script>
  <script src="ifs-modules.js"></script>
</body>
</html>
